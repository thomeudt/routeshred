services:
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: routeshred-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: routeshred-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5050
      - OSRM_API=${OSRM_API:-http://router.project-osrm.org}
      - ROUTING_ENGINE=brouter
      - BROUTER_API=http://brouter:17777/brouter
      - BROUTER_FALLBACK_TO_OSRM=false
      - BROUTER_CUSTOM_PROFILES_DIR=/app/brouter-data/customprofiles
      - BROUTER_SEGMENTS_DIR=/app/brouter-data/segments4
      - ROUTESHRED_CACHE_DIR=/app/data/cache
      - ROUTESHRED_PROFILE_DIR=/app/data/profiles
      - ROUTESHRED_ROUTES_DIR=/app/data/routes
      - ROUTESHRED_GROUP_RIDES_DIR=/app/data/group-rides
      - KEYCLOAK_ENABLED=${KEYCLOAK_ENABLED:-true}
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-routeshred}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-routeshred-frontend}
      - THUNDERFOREST_API_KEY=${THUNDERFOREST_API_KEY:-}
      - AI_ROUNDTRIP_ENABLED=${AI_ROUNDTRIP_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-nano}
      - OPENAI_API_URL=${OPENAI_API_URL:-https://api.openai.com/v1/responses}
      - AI_ROUNDTRIP_TIMEOUT_MS=${AI_ROUNDTRIP_TIMEOUT_MS:-20000}
      - AI_ROUNDTRIP_CANDIDATES=${AI_ROUNDTRIP_CANDIDATES:-1}
      - AI_ROUNDTRIP_ROUTE_CANDIDATES=${AI_ROUNDTRIP_ROUTE_CANDIDATES:-1}
      - AI_ROUNDTRIP_MAX_TIME_FACTOR=${AI_ROUNDTRIP_MAX_TIME_FACTOR:-1.18}
      - AI_ROUNDTRIP_ALLOW_FALLBACK=${AI_ROUNDTRIP_ALLOW_FALLBACK:-true}
      - TILE_CACHE_TTL_MS=${TILE_CACHE_TTL_MS:-7776000000}
      - CORS_ORIGIN=${PUBLIC_BASE_URL}
    volumes:
      - ./data/cache:/app/data/cache
      - ./data/profiles:/app/data/profiles
      - ./data/routes:/app/data/routes
      - ./data/group-rides:/app/data/group-rides
      - ./docs/USER_MANUAL.md:/app/docs/USER_MANUAL.md:ro
      - ./docs/screenshots:/app/docs/screenshots:ro
      - ./brouter-data/segments4:/app/brouter-data/segments4
      - ./brouter-data/customprofiles:/app/brouter-data/customprofiles
    depends_on:
      - brouter
      - keycloak

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_KEYCLOAK_ENABLED: "true"
        REACT_APP_KEYCLOAK_URL: ${PUBLIC_BASE_URL}/auth
        REACT_APP_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-routeshred}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-routeshred-frontend}
        REACT_APP_TILE_URL: ${REACT_APP_TILE_URL:-/api/tiles/cycle/{z}/{x}/{y}.png}
        REACT_APP_TILE_ATTRIBUTION: ${REACT_APP_TILE_ATTRIBUTION:-&copy; <a href="https://www.opencyclemap.org">OpenCycleMap</a>}
    container_name: routeshred-frontend
    restart: unless-stopped
    depends_on:
      - backend

  brouter:
    build:
      context: https://github.com/abrensch/brouter.git#v1.7.9
    image: routeshred-brouter:1.7.9
    container_name: routeshred-brouter
    restart: unless-stopped
    volumes:
      - ./brouter-data/segments4:/segments4
      - ./brouter-data/customprofiles:/customprofiles
      - ./brouter-data/customprofiles:/profiles2

  keycloak-db:
    image: postgres:16-alpine
    container_name: routeshred-keycloak-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USER}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: routeshred-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak-db
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HOSTNAME_URL=${PUBLIC_BASE_URL}/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      - keycloak-db
    volumes:
      - ./docs/keycloak/routeshred-realm.json:/opt/keycloak/data/import/routeshred-realm.json:ro
      - ./docs/keycloak/themes:/opt/keycloak/themes:ro

volumes:
  caddy_data:
  caddy_config:
  keycloak_db_data:
